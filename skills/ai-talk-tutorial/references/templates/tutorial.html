<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--TITLE--></title>
<style>
/* 杂志长读风:暖纸底 + 衬线中文标题 + 窄栏正文。
   窄栏是这套风格的关键 —— 三千字中文连排,行宽超过 40 字/行时眼睛回扫会丢行,
   旧版 940px 满宽正文正是"没有呼吸"的主因,--measure 收到 720px。 */
:root{
  --bg:#F4F1EC; --panel:#FFFDFA; --panel-2:#EFEBE3;
  --ink:#1C1A17; --ink-soft:#6B6558; --ink-faint:#948D80;
  --rule:#DED8CD; --rule-soft:#EAE5DB;
  --accent:#8C3A2B; --accent-soft:#F3E5E0; --on-accent:#FFFCF7;
  --brand:#2A4A7B; --brand-soft:#E6EBF3;
  --gold:#A67C1E; --gold-soft:#F6EDD9;
  --warn:#B23A20; --warn-soft:#F8E6E0;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","Source Han Serif CN",
    "STSong",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Code",monospace;
  --measure:720px;   /* 正文栏宽 */
  --wide:1080px;     /* 封面/图示等出血内容 */
  --shadow:0 1px 2px rgba(28,26,23,.06),0 8px 24px rgba(28,26,23,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16151A; --panel:#1D1C22; --panel-2:#232128;
    --ink:#EDEAE3; --ink-soft:#9A948A; --ink-faint:#726C64;
    --rule:#302E36; --rule-soft:#26242B;
    /* 深色下 accent 是浅橙,压白字对比度不足 —— 反过来用深色字 */
    --accent:#D98570; --accent-soft:#33221E; --on-accent:#16151A;
    --brand:#8AB0E0; --brand-soft:#1D2836;
    --gold:#D6AC5A; --gold-soft:#312713;
    --warn:#E8836A; --warn-soft:#331D18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17.5px;line-height:1.9;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
.wrap{max-width:var(--measure);margin:0 auto;padding:0 24px}
.wrap-wide{max-width:var(--wide);margin:0 auto;padding:0 24px}

/* ── 页头 ─────────────────────────────────────────────
   无封面时是暖纸底黑字;有封面时(.has-img)整块转为图上压字,
   两套配色都写死在 .hero 内,不依赖深浅模式 —— 封面图本身的明暗不受主题切换影响。 */
header.hero{position:relative;overflow:hidden;background:var(--panel-2)}
header.hero .wrap{position:relative;z-index:2;padding-top:72px;padding-bottom:56px}
.hero-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;
  transform:scale(1.06);filter:saturate(.92)}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,9,8,.35) 0%,rgba(10,9,8,.62) 45%,rgba(10,9,8,.86) 100%)}
header.hero.has-img .wrap{padding-top:180px}
header.hero.has-img h1{color:#FFFCF7;text-shadow:0 2px 18px rgba(0,0,0,.45)}
header.hero.has-img .meta{color:rgba(255,252,247,.82)}
header.hero.has-img .meta a{color:#FFFCF7;border-bottom-color:rgba(255,252,247,.5)}
header.hero.has-img .kicker{color:rgba(255,252,247,.7)}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:14px;font-family:var(--sans)}
h1{font-family:var(--serif);font-weight:700;
  font-size:clamp(28px,5vw,46px);line-height:1.28;letter-spacing:.01em;margin:0 0 18px}
.meta{color:var(--ink-soft);font-size:14.5px;line-height:1.7}
.meta a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--rule)}

/* ── 章节 ───────────────────────────────────────────── */
section{padding:56px 0 8px}
section+section{border-top:1px solid var(--rule-soft)}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(21px,3vw,28px);
  line-height:1.4;margin:0 0 28px;color:var(--ink);position:relative;padding-top:34px}
/* 章节序号:压在标题上方的小号编号。
   用 01/02 而不是「一/二」—— 中文数字在 13px 衬线下就是一到三根横线,
   实测截图里「一」和一条装饰线完全分不出来。 */
h2::before{content:attr(data-idx);position:absolute;top:0;left:0;
  font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.18em;
  color:var(--accent);opacity:.9}
h3{font-family:var(--serif);font-size:20px;font-weight:700;margin:40px 0 10px;line-height:1.5}
p{margin:0 0 1.15em}
a{color:var(--brand)}
code{font-family:var(--mono);font-size:.88em;background:var(--panel-2);
  padding:.12em .38em;border-radius:4px}
strong{font-weight:700;color:var(--ink)}

/* ── 面板 / 列表 ───────────────────────────────────── */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:26px 28px;box-shadow:var(--shadow)}
.panel > :last-child{margin-bottom:0}
ul,ol{padding-left:1.3em;margin:0 0 1.15em}
li{margin:.5em 0}
.check{list-style:none;padding-left:0}
.check li{position:relative;padding-left:32px}
.check li::before{content:"";position:absolute;left:0;top:.62em;
  width:15px;height:15px;border:1.5px solid var(--accent);border-radius:4px}

/* ── 提示块 ───────────────────────────────────────────
   封闭三种类型,由 build-html.js 的 CALLOUT_TYPES 决定 */
.callout{margin:26px 0;padding:18px 22px;border-radius:0 12px 12px 0;border-left:3px solid}
.callout p{margin:0}
.callout-t{font-family:var(--serif);font-weight:700;margin-bottom:6px}
.callout-tip{border-color:var(--gold);background:var(--gold-soft)}
.callout-warning{border-color:var(--warn);background:var(--warn-soft)}
.callout-note{border-color:var(--brand);background:var(--brand-soft)}

/* ── 流程图示 :::flow ─────────────────────────────────
   纯 CSS 竖向连线,不引 mermaid.js(内联要 ~1MB,归档体积不划算)。
   竖排而非横排:中文步骤说明长度不一,横排会因最长项撑高整行且移动端必然溢出。 */
ol.flow{list-style:none;counter-reset:flow;padding:0;margin:30px 0}
ol.flow li{position:relative;counter-increment:flow;padding:0 0 26px 52px;margin:0}
ol.flow li::before{content:counter(flow);position:absolute;left:0;top:2px;
  width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans)}
/* 连接线:最后一项不画,否则线会垂到段落外 */
ol.flow li::after{content:"";position:absolute;left:15.5px;top:38px;bottom:8px;
  width:1.5px;background:var(--rule)}
ol.flow li:last-child{padding-bottom:0}
ol.flow li:last-child::after{display:none}
.flow-t{display:block;font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.6}
.flow-d{display:block;color:var(--ink-soft);font-size:15.5px;line-height:1.75;margin-top:2px}

/* ── 常见误区:左右对照 ──────────────────────────────
   两栏而非一行 —— 这一段的价值全在"别做 X / 而要做 Y"的对照关系上。
   窄屏折成上下两行,靠色条区分,不靠左右位置。 */
ul.pitfalls{list-style:none;padding:0;margin:30px 0}
ul.pitfalls li{display:grid;grid-template-columns:1fr 1fr;gap:0;
  margin-bottom:12px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background:var(--panel);box-shadow:var(--shadow)}
.pf-no,.pf-yes{padding:16px 18px;font-size:15.5px;line-height:1.75}
.pf-no{background:var(--warn-soft);border-left:3px solid var(--warn)}
.pf-yes{background:var(--panel);border-left:3px solid var(--gold)}
.pf-no::before{content:"常见做法";display:block;font-size:11px;letter-spacing:.14em;
  font-family:var(--mono);color:var(--warn);margin-bottom:6px}
.pf-yes::before{content:"讲者主张";display:block;font-size:11px;letter-spacing:.14em;
  font-family:var(--mono);color:var(--gold);margin-bottom:6px}
ul.pitfalls li.pf-plain{display:block;padding:16px 18px}
@media (max-width:600px){ ul.pitfalls li{grid-template-columns:1fr} }

/* ── 数字卡 :::stats ──────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin:30px 0}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:20px 18px;text-align:center;box-shadow:var(--shadow)}
.stat-v{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.2;
  color:var(--accent);letter-spacing:-.01em}
.stat-l{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin-top:8px}

/* ── 表格 ─────────────────────────────────────────────
   .tw 负责移动端横向滚动:窄栏正文放不下三列中文表,不给滚动容器会撑破 body */
.tw{overflow-x:auto;margin:30px 0;-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:15.5px;line-height:1.7;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  overflow:hidden;min-width:min(100%,460px)}
table.dt th,table.dt td{padding:12px 16px;text-align:left;vertical-align:top;
  border-bottom:1px solid var(--rule-soft)}
table.dt thead th{background:var(--panel-2);font-family:var(--serif);font-weight:700;
  font-size:15px;white-space:nowrap}
table.dt tbody tr:last-child td{border-bottom:0}

/* ── 术语对照:默认折叠,给人工复核用 ───────────────── */
details.glossary{margin:8px 0 0;border:1px solid var(--rule);border-radius:12px;
  background:var(--panel)}
details.glossary summary{cursor:pointer;padding:14px 20px;font-size:14px;color:var(--ink-soft)}
details.glossary table{width:100%;border-collapse:collapse;font-size:13.5px}
details.glossary th,details.glossary td{border-top:1px solid var(--rule-soft);
  padding:10px 20px;text-align:left;vertical-align:top}
details.glossary th{color:var(--ink-soft);font-weight:600}

/* ── 金句 ─────────────────────────────────────────── */
blockquote{margin:30px 0;padding:0 0 0 26px;border-left:3px solid var(--gold)}
blockquote .en{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.7;
  display:block;margin-bottom:10px}
blockquote .zh{color:var(--ink-soft);font-size:15.5px;line-height:1.8;display:block}
blockquote a.ts{font-family:var(--mono);font-style:normal;font-size:13px;
  color:var(--accent);text-decoration:none;font-weight:600;margin-right:6px}

.embed{position:relative;padding-top:56.25%;margin:36px 0 8px;border-radius:14px;
  overflow:hidden;box-shadow:var(--shadow)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

footer{padding:44px 0 64px;color:var(--ink-faint);font-size:13px;
  border-top:1px solid var(--rule-soft);margin-top:48px}

@media (max-width:680px){
  body{font-size:16.5px}
  header.hero .wrap{padding-top:52px;padding-bottom:40px}
  header.hero.has-img .wrap{padding-top:120px}
  section{padding:40px 0 8px}
  .panel{padding:20px}
}
</style>
</head>
<body>
<header class="hero<!--HEROCLASS-->"><!--HEROIMG--><div class="wrap">
  <div class="kicker">AI Talk Tutorial</div>
  <h1><!--TITLE--></h1>
  <div class="meta"><!--META--></div>
</div></header>

<section id="tldr"><div class="wrap"><h2 data-idx="01"><!--H2_TLDR--></h2><div class="panel"><!--TLDR--></div></div></section>
<section id="background"><div class="wrap"><h2 data-idx="02"><!--H2_BACKGROUND--></h2><!--BACKGROUND--></div></section>
<section id="method"><div class="wrap"><h2 data-idx="03"><!--H2_METHOD--></h2><!--METHOD--></div></section>
<section id="pitfalls"><div class="wrap"><h2 data-idx="04"><!--H2_PITFALLS--></h2><!--PITFALLS--></div></section>
<section id="checklist"><div class="wrap"><h2 data-idx="05"><!--H2_CHECKLIST--></h2><div class="panel"><!--CHECKLIST--></div></div></section>
<section id="apply"><div class="wrap"><h2 data-idx="06"><!--H2_APPLY--></h2><!--APPLY--></div></section>
<section id="quotes"><div class="wrap"><h2 data-idx="07"><!--H2_QUOTES--></h2><!--QUOTES--><div class="embed"><!--EMBED--></div></div></section>

<!--GLOSSARY-->
<footer><div class="wrap"><!--FOOTER--></div></footer>
</body>
</html>
